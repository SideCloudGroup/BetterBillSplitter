services:
  web:
    image: ghcr.io/sidecloudgroup/betterbillsplitter:latest
    ports:
      - "127.0.0.1:17985:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data/archive:/app/data/archive
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: always
    logging:
      options:
        max-size: "3m"
        max-file: "2"

  mariadb:
    image: mariadb:latest
    volumes:
      - ./data/mariadb/data:/var/lib/mysql
      - ./data/mariadb/conf:/etc/mysql/conf.d
    environment:
      MARIADB_ROOT_PASSWORD: change-me-root
      MARIADB_DATABASE: expense
      MARIADB_USER: expense
      MARIADB_PASSWORD: change-me
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin -h localhost -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "3m"
        max-file: "2"
